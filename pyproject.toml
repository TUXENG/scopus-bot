[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scopus-bot"
version = "0.1.0"
description = "Automatización de búsquedas en Scopus y exportación de resultados"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40,<2.0",
    "openpyxl>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]